name: Publish site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [lit-review-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out lit-review
        uses: actions/checkout@v4
        with:
          repository: luqmanblukman/lit-review
          path: lit-review

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Prepare lit-review
        run: ./prepare-lit-review.sh

      - name: Render site
        run: quarto render

      - name: Render sprint decks as slides
        run: |
          shopt -s nullglob
          for deck in lit-review/sprints/*/deck.md; do
            out="_site/${deck%deck.md}slides.html"
            npx --yes @marp-team/marp-cli@4.0.3 "$deck" -o "$out"
          done

      # Review copy: download from the run page, unzip, open index.html.
      # The deploy job waits for approval on the github-pages environment.
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
