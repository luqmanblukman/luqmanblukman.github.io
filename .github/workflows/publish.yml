name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, needed to restore file times below

      # A fresh checkout stamps every file with the current time, and Quarto
      # uses file times for <lastmod> in sitemap.xml. Reset each source file's
      # time to its last commit so lastmod only changes when the page does.
      - name: Restore file times from git history
        run: |
          git ls-files -z -- '*.qmd' '*.md' | while IFS= read -r -d '' f; do
            touch -d "@$(git log -1 --format=%ct -- "$f")" "$f"
          done

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      # Review copy: download from the run page, unzip, open index.html.
      # The deploy job waits for approval on the github-pages environment.
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
