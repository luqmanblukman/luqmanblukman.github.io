project:
  type: website
  output-dir: _site
  resources:
    - llms.txt
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "posts/**/*.md"
    - "reviews/**/*.qmd"
    - "reviews/**/*.md"
    # _-prefixed files, dot-dirs (.claude/, .papers/) and README/AGENTS/CLAUDE at the root are not rendered

website:
  title: "Luqman B Lukman"
  site-url: https://luqmanblukman.github.io
  favicon: assets/favicon.png
  repo-url: https://github.com/luqmanblukman/luqmanblukman.github.io
  navbar:
    left:
      - href: blog.qmd
        text: Blog
      - href: reviews/index.qmd
        text: Paper reviews
      - href: about.qmd
        text: About
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/luqmanblukman/
        aria-label: LinkedIn
      - icon: medium
        href: https://luqmanblukman.medium.com/
        aria-label: Medium
      - icon: github
        href: https://github.com/luqmanblukman
        aria-label: GitHub
      - icon: rss
        href: blog.xml
        aria-label: RSS feed

format:
  html:
    theme:
      light: [cosmo, theme-light.scss, theme-common.scss]
      dark: [darkly, theme-dark.scss, theme-common.scss]
    toc: true
    bibliography: references.bib
    link-citations: true
    filters:
      - mermaid-fences.lua
    include-before-body: _ticker.html
    include-after-body: mermaid.html
