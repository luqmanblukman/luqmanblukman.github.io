project:
  type: website
  output-dir: _site
  pre-render: scripts/status.py
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "posts/**/*.md"
    - "lit-review/**/*.md"
    - "!lit-review/CLAUDE.md"
    # _-prefixed files (templates) and dot-dirs (.claude/) are skipped by Quarto automatically

website:
  title: "Luqman B Lukman"
  site-url: https://luqmanblukman.github.io
  repo-url: https://github.com/luqmanblukman/luqmanblukman.github.io
  navbar:
    left:
      - href: blog.qmd
        text: Blog
      - href: lit-review/index.md
        text: Literature review
      - href: about.qmd
        text: About
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/luqmanblukman/
        aria-label: LinkedIn
      - icon: medium
        href: https://luqmanblukman.medium.com/
        aria-label: Medium
      - icon: github
        href: https://github.com/luqmanblukman
        aria-label: GitHub
      - icon: rss
        href: blog.xml
        aria-label: RSS feed
  sidebar:
    - title: "Literature review"
      contents:
        - lit-review/index.md
        - lit-review/PROTOCOL.md
        - lit-review/reading-list.md
        - section: Synthesis
          contents: "lit-review/synthesis/*.md"
        - section: Papers
          href: lit-review/papers/index.md
          contents: "lit-review/papers/[0-9]*.md"
        - section: Experiments
          href: lit-review/experiments/index.md
          contents: "lit-review/experiments/[0-9]*/index.md"
        - section: Sprints
          href: lit-review/sprints/index.md
          contents: "lit-review/sprints/sprint-*/*.md"

format:
  html:
    theme:
      light: [cosmo, theme-light.scss, theme-common.scss]
      dark: [darkly, theme-dark.scss, theme-common.scss]
    toc: true
    bibliography: lit-review/references.bib
    link-citations: true
    filters:
      - mermaid-fences.lua
    include-before-body: _ticker.html
    include-after-body: mermaid.html
